<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML Builder</title>
    <link rel="manifest" href="./index.webmanifest" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/johnhenry/domkit@7652163205b366ad9560beb5787ce33ae2979413/src/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/johnhenry/domkit@7652163205b366ad9560beb5787ce33ae2979413/src/tabbed-ui/index.css" />
    <link rel="stylesheet" href="./editor.css" />
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@7652163205b366ad9560beb5787ce33ae2979413/src/tabbed-ui/global.mjs"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@7652163205b366ad9560beb5787ce33ae2979413/src/hot-key/global.mjs"></script>
    <script type="module" src="./src/editor.mjs"></script>
  </head>
  <body>
    <main id="editor">
      <header class="toolbar">
        <h1>HTML Builder</h1>
        <label class="title">Title <input id="title" /></label>
        <button type="button" id="new">New</button>
        <button type="button" id="open">Open…</button>
        <input type="file" id="open-file" accept=".html,.htm,text/html" hidden />
        <a id="download" href="#" download="page.html">Download</a>
        <button type="button" id="undo" disabled title="Undo (⌘Z / Ctrl+Z)">Undo</button>
        <button type="button" id="redo" disabled title="Redo (⇧⌘Z / Ctrl+Y)">Redo</button>
      </header>

      <aside class="palette" aria-label="Palette">
        <input type="search" id="palette-filter" placeholder="Filter" aria-label="Filter the palette" />
        <div id="palette"></div>
      </aside>

      <section class="outline" aria-labelledby="outline-heading">
        <h2 id="outline-heading">Page</h2>
        <ul id="tree" role="tree" aria-labelledby="outline-heading"></ul>
      </section>

      <section class="stage" aria-label="Preview">
        <iframe id="preview" title="Preview" sandbox="allow-scripts allow-modals allow-pointer-lock allow-popups"></iframe>
      </section>

      <aside class="side">
        <tabbed-ui>
          <div aria-label="Panels"><button type="button">Element</button><button type="button">CSS</button><button type="button">Libraries</button></div>
          <section id="inspector"></section>
          <section>
            <label for="css">CSS for the page</label>
            <textarea id="css" spellcheck="false"></textarea>
          </section>
          <section>
            <p class="hint">Each library's modules load in the page (and the preview); its manifest (a <code>custom-elements.json</code>) fills the palette and the element panel.</p>
            <ol id="library-list"></ol>
            <button type="button" id="add-library">Add library</button>
          </section>
        </tabbed-ui>
      </aside>
    </main>

    <!-- Shortcuts (they don't fire while typing in a field). -->
    <hot-key hotkey="delete backspace" commandfor="editor" command="--delete"></hot-key>
    <hot-key hotkey="mod+d" commandfor="editor" command="--duplicate"></hot-key>
  </body>
</html>
