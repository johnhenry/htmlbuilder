<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Forsnaken</title>
    <meta name="htmlbuilder-manifest" content="domkit https://cdn.jsdelivr.net/gh/johnhenry/domkit@c33787ccf5bf87f089f3f0bd90b6999fc9dc61cf/custom-elements.json">
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@c33787ccf5bf87f089f3f0bd90b6999fc9dc61cf/src/frame-timer/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@c33787ccf5bf87f089f3f0bd90b6999fc9dc61cf/src/pixelable/pixel-canvas/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@c33787ccf5bf87f089f3f0bd90b6999fc9dc61cf/src/hot-key/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@c33787ccf5bf87f089f3f0bd90b6999fc9dc61cf/src/gamepad-input/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/domkit@c33787ccf5bf87f089f3f0bd90b6999fc9dc61cf/src/swipe-input/global.mjs" data-library="domkit"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/johnhenry/forsnaken@881f2a6f661fd28618ade6b231f7fb273e0824f7/game/global.mjs" data-library="forsnaken"></script>
    <template data-snippet="Screen (pixel-canvas with a grid)"><pixel-canvas width="800" effects="grid(8, transparent, 3)"></pixel-canvas></template>
    <template data-snippet="Game board"><forsnaken-game width="100" height="50"></forsnaken-game></template>
    <template data-snippet="Clock (24 fps)"><frame-timer fps="24"></frame-timer></template>
    <template data-snippet="Apples"><forsnaken-apple count="64" x-range="10,89" y-range="10,39"></forsnaken-apple></template>
    <template data-snippet="Wall (diagonal)"><forsnaken-wall x="1" y="1" x1="9" y1="9" shape="diagonal"></forsnaken-wall></template>
    <template data-snippet="Snake (green)"><forsnaken-snake id="green" color="#4e9a06" x="0" y="0" direction="right"></forsnaken-snake></template>
    <template data-snippet="Snake (steers itself)"><forsnaken-snake id="white" color="#ffffff" x="50" y="25" direction="right"><snake-brain-random></snake-brain-random></forsnaken-snake></template>
    <template data-snippet="Brain: random"><snake-brain-random></snake-brain-random></template>
    <template data-snippet="Brain: greedy (seeks apples)"><snake-brain-greedy></snake-brain-greedy></template>
    <template data-snippet="Arrow keys for green"><hot-key hotkey="arrowup" commandfor="green" command="--up"></hot-key><hot-key hotkey="arrowdown" commandfor="green" command="--down"></hot-key><hot-key hotkey="arrowleft" commandfor="green" command="--left"></hot-key><hot-key hotkey="arrowright" commandfor="green" command="--right"></hot-key></template>
    <template data-snippet="Controller for green"><gamepad-input commandfor="green" up="--up" down="--down" left="--left" right="--right"></gamepad-input></template>
    <style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: black; color: white; }
pixel-canvas { inline-size: min(100%, 800px); background: #4e9a06; }
    </style>
  </head>
  <body>
  </body>
</html>
